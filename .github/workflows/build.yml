name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release (e.g. v1.0.0)"
        required: true
  push:
    tags:
      - "v*"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs:
          - { goos: windows, goarch: amd64, goamd64: v3, output: amd64 }
          - { goos: darwin,  goarch: arm64, output: arm64 }
          - { goos: linux,   goarch: amd64, goamd64: v3, output: amd64 }
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Set variables
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILDTIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "CGO_ENABLED=0" >> $GITHUB_ENV
          echo "GOTOOLCHAIN=local" >> $GITHUB_ENV

      - name: Test
        if: ${{ matrix.jobs.goos == 'linux' }}
        run: go test -tags with_tailscale ./adapter/outbound/ ./component/tailscalestamp/ -v -count=1

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt component/ca/ca-certificates.crt

      - name: Build
        env:
          GOOS: ${{ matrix.jobs.goos }}
          GOARCH: ${{ matrix.jobs.goarch }}
          GOAMD64: ${{ matrix.jobs.goamd64 }}
        run: |
          go build -v -tags "with_gvisor,with_tailscale" -trimpath \
            -ldflags "-extldflags --static -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid="

          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            cp mihomo.exe mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}.exe
            zip mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}-${VERSION}.zip \
                mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}.exe
          else
            cp mihomo mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}
            gzip -c mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }} \
              > mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}-${VERSION}.gz
            rm mihomo-${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}
          fi

      - name: Save version
        run: echo "${VERSION}" > version.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.jobs.goos }}-${{ matrix.jobs.output }}"
          path: |
            mihomo*.gz
            mihomo*.zip
            version.txt

  release:
    permissions: write-all
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Calculate checksums
        run: |
          cd bin/
          find . -type f -not -name "checksums.txt" -not -name "version.txt" | sort | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Determine version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: bin/*
          generate_release_notes: true
          body: |
            mihomo with Tailscale outbound support.

            Built with `with_gvisor,with_tailscale` tags.

            | File | Platform |
            |---|---|
            | `mihomo-windows-amd64-*` | Windows x86_64 |
            | `mihomo-darwin-arm64-*` | macOS Apple Silicon |
            | `mihomo-linux-amd64-*` | Linux x86_64 |
